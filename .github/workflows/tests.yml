name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["r/**", ".github/workflows/r.yml"]
  pull_request:
    paths-ignore: ["r/**", ".github/workflows/r.yml"]
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        # On macOS and Windows, test only the oldest and the newest version
        exclude:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install
        shell: bash
        run: |
          extras="--extra test --extra plot"
          # pysam has no Windows wheels: the BAM tests are skipped there
          if [ "$RUNNER_OS" != "Windows" ]; then extras="$extras --extra bam"; fi
          uv sync --locked --no-dev $extras --extra anndata

      - name: Run tests
        run: uv run --no-sync pytest -v --tb=short -rs

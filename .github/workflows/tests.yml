name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # pysam has no Windows wheels: the BAM tests are skipped there
      EXTRAS: ${{ matrix.os == 'windows-latest' && '--extra test' || '--extra test --extra bam' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev ${{ env.EXTRAS }}

      - name: Run tests
        run: uv run --no-sync pytest -v --tb=short -rs

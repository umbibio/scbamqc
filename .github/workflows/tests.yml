name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Python 3.15 is a pre-release: its failures do not fail the run
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        shell: bash
        run: |
          extras="--extra test --extra plot"
          # pysam has no Windows wheels: the BAM tests are skipped there
          if [ "$RUNNER_OS" != "Windows" ]; then extras="$extras --extra bam"; fi
          if [ "$UV_PYTHON" = "3.15" ]; then
            # The lock file has no 3.15 wheels for all packages: resolve again.
            # h5py has no 3.15 wheels yet: the AnnData tests are skipped.
            uv sync --upgrade --no-dev $extras
          else
            uv sync --locked --no-dev $extras --extra anndata
          fi

      - name: Run tests
        run: uv run --no-sync pytest -v --tb=short -rs

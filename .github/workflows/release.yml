name: Update Stable Tag and Create Release

on:
  workflow_call:

jobs:
  update-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Move the stable tag and create the release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # All history and tags

      - name: Update stable tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          echo "Moving stable tag to $GITHUB_REF_NAME (commit: $commit)"
          git tag -f stable "$commit"
          git push origin refs/tags/stable -f

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes \
            --latest

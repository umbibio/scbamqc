name: Upload Python Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"  # Release tags only, for example v0.1.0 (not v0.1.0.dev1)

jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/tests.yml

  publish-release:
    needs: test
    name: Publish GitHub release
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write  # Move the stable tag and create the release

  deploy:
    needs: publish-release
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write  # PyPI trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check that the tag agrees with the package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not agree with package version $version"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
